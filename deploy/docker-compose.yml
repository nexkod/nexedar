services:
  nexedar:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: nexedar-service
    restart: unless-stopped
    ports:
      - "${PORT:-8092}:8090"
    env_file:
      - .env
    environment:
      - PORT=8090
      - DATA_DIR=/data
      - PUBLIC_URL=${PUBLIC_URL:-https://edar.nexkod.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-nexkod-edar-admin}
      - API_SECRET=${API_SECRET:-nx_sec_live_99a8b7c6d5e4f3}
      - MAX_BUILDS_PER_APP=${MAX_BUILDS_PER_APP:-3}
    volumes:
      - ./data:/data
